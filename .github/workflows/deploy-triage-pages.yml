name: Deploy mock TB triage frontend

on:
  push:
    branches:
      - main
    paths:
      - "backend/static/**"
      - ".github/workflows/deploy-triage-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build static site
        shell: bash
        run: |
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          source = Path("backend/static")
          site = Path("_site")
          static = site / "static"
          static.mkdir(parents=True, exist_ok=True)
          for item in source.iterdir():
              destination = static / item.name
              if item.is_dir():
                  shutil.copytree(item, destination, dirs_exist_ok=True)
              else:
                  shutil.copy2(item, destination)

          base_path = "/" + os.environ["GITHUB_REPOSITORY"].split("/", 1)[1]
          index = (static / "index.html").read_text(encoding="utf-8")
          index = index.replace(
              'window.TBTABasePath = "";',
              f'window.TBTABasePath = "{base_path}";',
          )
          index = index.replace('"/static/', f'"{base_path}/static/')
          (site / "index.html").write_text(index, encoding="utf-8")
          (site / "404.html").write_text(index, encoding="utf-8")
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
